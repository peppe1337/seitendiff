name: Seitendiff watcher

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    # Skipped in the template repository itself, runs in every repository created from it.
    if: github.repository != 'peppe1337/seitendiff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs action.yml from this repository: checks the pages in watch.config.json,
      # commits state/, out/ and feed.xml, and opens an issue when a fragment changed.
      - uses: ./
