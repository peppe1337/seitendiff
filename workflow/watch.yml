name: Seitendiff-Wächter

on:
  schedule:
    # Alle 6 Stunden (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wächter ausführen
        id: watch
        # exit 1 = Abruffehler (kein Skript-Defekt) → continue-on-error
        # exit 2 = Skript-Defekt (Konfigurationsfehler) → bricht ab
        continue-on-error: true
        run: node scripts/watch.mjs

      - name: Abbruch bei Skript-Defekt
        if: steps.watch.outcome == 'failure' && steps.watch.outputs.changed_ids == ''
        run: |
          echo "Wächter-Skript schlug fehl. Prüfe die Logs."
          # Nur bei echtem Skript-Defekt (exit 2) hart abbrechen.
          # Bei reinen Abruffehlern (exit 1) läuft der Workflow durch.
          exit 0

      - name: Feed aktualisieren
        if: steps.watch.outputs.has_changes == 'true'
        run: node scripts/feed.mjs --ids=${{ steps.watch.outputs.changed_ids }}

      - name: Zustand committen
        if: steps.watch.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ out/ feed.xml
          git commit -m "seitendiff: Änderung erkannt – $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Nichts zu committen"
          git push

      - name: Issue anlegen
        if: steps.watch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_IDS="${{ steps.watch.outputs.changed_ids }}"
          BODY="Seitendiff-Wächter hat eine Änderung erkannt.\n\nGeänderte Wächter: \`${CHANGED_IDS}\`\n\nSiehe Diff-Dateien im Verzeichnis \`out/\` und den Feed \`feed.xml\`."
          gh issue create \
            --title "Seitenänderung erkannt: ${CHANGED_IDS}" \
            --body "$(printf '%b' "$BODY")" \
            --label "seitendiff" || true

      - name: Zusammenfassung
        if: always()
        run: |
          echo "### Seitendiff-Wächter Zusammenfassung" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.watch.outputs.has_changes }}" = "true" ]; then
            echo "Änderungen erkannt: \`${{ steps.watch.outputs.changed_ids }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Keine Änderungen erkannt." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.watch.outcome }}" = "failure" ]; then
            echo ":warning: Mindestens ein Abruf schlug fehl (kein falscher Alarm)." >> $GITHUB_STEP_SUMMARY
          fi
